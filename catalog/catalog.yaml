# Skill and agent catalog for the category-v1 router. Draft of 2026-11-20, tagged by hand.
#
# Each entry is {name, category} plus any field that differs from `defaults`:
#   also    extra categories whose candidate pool also includes this entry
#   action  prompt (short style text) | session (load the skill) | agent (recommend a subagent)
#   invoke  auto (router may suggest) | user (only when the user names it) | internal (spawned by another skill)
#   kind    skill | command | agent
#   reason  manual | override | rule  (how the category was assigned)
# Names match the live roster: my-skills install unprefixed into ~/.claude/skills; plugin
# entries are <plugin>:<skill>. Live skills missing here fall back to categories.yaml keywords.
defaults: {kind: skill, action: session, invoke: auto, reason: manual}

