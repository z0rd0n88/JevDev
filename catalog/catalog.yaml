# Skill and agent catalog for the category-v1 router. Draft of 2026-11-21, tagged by hand.
#
# Each entry is {name, category} plus any field that differs from `defaults`:
#   also      extra categories whose candidate pool also includes this entry
#   action    prompt (short style text) | session (load the skill) | agent (recommend a subagent)
#   invoke    auto (router may suggest) | user (only when the user names it: skillOverrides
#             user-invocable-only, disable-model-invocation, aliases) | internal (spawned by
#             another skill) | "off" (skillOverrides off; quote it, YAML reads bare off as false)
#   kind      skill | command | agent. Agents get their own namespace, so a skill and an agent
#             may share a name (code-tour).
#   projects  repos whose .claude/agents carry this agent
#   reason    manual | override | rule  (how the category was assigned)
# Names match the live roster: plugin skills are <plugin>:<skill> (my-skills installs as the
# my-skills@z0rd0nlander plugin); loose ~/.claude/skills are unprefixed. Live skills missing
# here fall back to categories.yaml keywords; `skill_router.py catalog` lists them.
defaults: {kind: skill, action: session, invoke: auto, reason: manual}

