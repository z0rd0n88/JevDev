[[hooks.UserPromptSubmit]]

[[hooks.UserPromptSubmit.hooks]]
type = "command"
command = '''bash -c '[ -r "$HOME/.secrets" ] && . "$HOME/.secrets" >/dev/null 2>&1; exec python3 "$(git rev-parse --show-toplevel)/skill_router.py" --host codex hook' '''
timeout = 90
statusMessage = "Checking for a matching skill with Jev"

[[hooks.PreToolUse]]
matcher = "Bash"

[[hooks.PreToolUse.hooks]]
type = "command"
command = '''bash -c '[ -r "$HOME/.secrets" ] && . "$HOME/.secrets" >/dev/null 2>&1; SCOPE_SENTINEL=1 exec python3 "$(git rev-parse --show-toplevel)/scope_sentinel.py" hook codex' || true'''
timeout = 10
