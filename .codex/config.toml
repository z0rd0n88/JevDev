[[hooks.UserPromptSubmit]]

[[hooks.UserPromptSubmit.hooks]]
type = "command"
command = '''bash -c 'r=$(git rev-parse --show-toplevel) && exec bash "$r/with_jev_key.sh" python3 "$r/skill_router.py" --host codex hook' || true'''
timeout = 90
statusMessage = "Checking for a matching skill with Jev"

[[hooks.PreToolUse]]
matcher = "Bash"

[[hooks.PreToolUse.hooks]]
type = "command"
command = '''bash -c 'r=$(git rev-parse --show-toplevel) && SCOPE_SENTINEL=1 exec bash "$r/with_jev_key.sh" python3 "$r/scope_sentinel.py" hook codex' || true'''
timeout = 10

[[hooks.PreToolUse]]
matcher = "apply_patch"

[[hooks.PreToolUse.hooks]]
type = "command"
command = '''bash -c 'r=$(git rev-parse --show-toplevel) && SCOPE_SENTINEL=1 exec bash "$r/with_jev_key.sh" python3 "$r/scope_sentinel.py" hook codex' || true'''
timeout = 10

[[hooks.Stop]]

[[hooks.Stop.hooks]]
type = "command"
command = '''bash -c 'r=$(git rev-parse --show-toplevel) && exec bash "$r/with_jev_key.sh" python3 "$r/compact_advisor.py" hook codex' || true'''
timeout = 45
